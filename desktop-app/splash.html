<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EduProgress Loading</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-app-region: drag; /* Allows moving the splash screen */
        }
        
        .splash-container {
            width: 90%;
            height: 90%;
            background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
            border-radius: 8px; /* Bớt bo góc */
            box-shadow: 0 10px 25px rgba(34, 67, 151, 0.2), 0 0 0 1px rgba(226, 232, 240, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Decorative glowing orbs */
        .splash-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.3) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
        }
        .splash-container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(34, 67, 151, 0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
        }

        .logo {
            width: 120px;
            height: 120px;
            margin-bottom: 25px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(34, 67, 151, 0.2));
            animation: float 3s ease-in-out infinite;
            z-index: 2;
        }

        h1 {
            color: #224397;
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            z-index: 2;
        }

        p {
            color: #64748b;
            margin: 0 0 35px 0;
            font-size: 14px;
            font-weight: 500;
            z-index: 2;
        }

        .loader-wrapper {
            width: 200px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .loader-bar {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #38bdf8, #224397);
            border-radius: 4px;
            animation: slide 1.5s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes slide {
            0% { left: 0; width: 30%; }
            100% { left: 70%; width: 50%; }
        }

        .version {
            position: absolute;
            bottom: 20px;
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <img src="icon.png" alt="Logo" class="logo">
        <h1>Hệ Thống Thi Đua</h1>
        <p>Đang tải dữ liệu và khởi tạo môi trường...</p>
        
        <div class="loader-wrapper">
            <div class="loader-bar"></div>
        </div>
        
        <div class="version">PHIÊN BẢN 1.0.0</div>
    </div>
</body>
</html>
